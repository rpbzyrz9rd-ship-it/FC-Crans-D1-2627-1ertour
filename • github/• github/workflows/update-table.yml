name: Update FC Crans D-9 I table

on:
  schedule:
    # Runs once a day at 06:00 UTC (~08:00 in Switzerland, adjust as you like).
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write  # needed so the workflow can commit results.json / table.html

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py --debug

      - name: Commit updated results
        run: |
          git config user.name "fc-crans-table-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.json table.html
          git diff --quiet --cached || git commit -m "Update table $(date -u +'%Y-%m-%d')"
          git push
